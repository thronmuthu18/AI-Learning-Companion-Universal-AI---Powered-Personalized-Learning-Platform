apply plugin: 'com.android.library'

group = 'com.ailearningcompanion.executorch'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

android {
  namespace "com.ailearningcompanion.executorch"
  compileSdk safeExtGet("compileSdkVersion", 35)
  defaultConfig {
    minSdk safeExtGet("minSdkVersion", 24)
    targetSdk safeExtGet("targetSdkVersion", 35)
    ndk {
      abiFilters "arm64-v8a", "x86_64"
    }
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "org.pytorch:executorch-android:1.5.1"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
}
